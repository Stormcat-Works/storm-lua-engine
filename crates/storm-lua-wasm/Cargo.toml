[package]
name = "storm-lua-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Emscripten Lua execution adapter scaffold"

[lints]
workspace = true

[dependencies]
storm-lua-addon = { workspace = true }
storm-lua-vm = { workspace = true, features = ["backend-mlua"] }
serde_json = { workspace = true }
storm-lua-bridge = { workspace = true }
storm-lua-spec = { workspace = true }
storm-lua-microcontroller = { workspace = true }
storm-screen-raster = { workspace = true }

[features]
default = []
debug = ["storm-lua-microcontroller/debug", "storm-lua-vm/debug", "storm-lua-addon/debug"]

[lib]
crate-type = ["rlib"]

[[bin]]
name = "storm_lua_wasm"
path = "src/main.rs"
